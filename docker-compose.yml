services:
  baby-name-picker:
    build: .
    container_name: baby-name-picker
    ports:
      - "8080:8080"
    volumes:
      - baby-name-picker-data:/data
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Data Source=/data/babynames.db
      Llm__Provider: ${LLM_PROVIDER:-Ollama}
      Llm__BaseUrl: ${LLM_BASE_URL:-http://ollama:11434}
      Llm__Model: ${LLM_MODEL:-llama3.2}
      Llm__ApiKey: ${LLM_API_KEY:-}
      Admin__Username: ${ADMIN_USERNAME:-admin}
      Admin__Password: ${ADMIN_PASSWORD:-}
    networks:
      - shared
    restart: unless-stopped

volumes:
  baby-name-picker-data:

networks:
  shared:
    external: true
    name: ${DOCKER_SHARED_NETWORK:?Set DOCKER_SHARED_NETWORK in .env (see .env.example)}
